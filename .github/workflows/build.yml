name: Build RMK Firmware

on:
  push:
    branches: [ "master", "main", "Dev" ]
  pull_request:
    branches: [ "main", "Dev" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: thumbv7em-none-eabihf
        
    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y libclang-dev clang
        cargo install flip-link cargo-binutils
        rustup component add llvm-tools-preview
        
    - name: Build Firmware
      run: |
        chmod +x build_all.sh
        ./build_all.sh
        
    - name: Convert to UF2
      run: |
        wget https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2conv.py
        wget https://raw.githubusercontent.com/microsoft/uf2/master/utils/uf2families.json
        for elf in dist/*.elf; do
          base=$(basename "$elf" .elf)
          cargo objcopy -- -I elf32-littlearm -O ihex "$elf" "$base.hex"
          python3 uf2conv.py "$base.hex" -c -f 0xada52840 -o "$base.uf2"
        done

    - name: Build Artifact Name
      id: artifact
      run: |
        safe_ref="${GITHUB_REF_NAME//\//-}"
        echo "name=rmk-config-MKB2-${safe_ref}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: |
          dist/*.hex
          dist/*.uf2 